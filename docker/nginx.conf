server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # ------------------------------- kompresi --------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --------------------------- header keamanan -----------------------------
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # ------------------------------- healthcheck -----------------------------
    # Dipakai HEALTHCHECK di Dockerfile dan docker-compose.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------- aset ber-hash Vite: cache selamanya ------------------
    # Vite menaruh nama ber-hash di /assets, jadi aman di-cache lama.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ----------------------------- gambar statis -----------------------------
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # --------------------------- fallback SPA --------------------------------
    # index.html tidak boleh ikut ter-cache supaya deploy baru langsung terpakai.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Sembunyikan versi Nginx dari response header.
    server_tokens off;
}
